server {
    listen 80;
    server_name localhost;

    # La API se resuelve al momento de la petición (no al arrancar): si el backend
    # no está desplegado, el frontend sigue sirviéndose y solo /api/ responde 502.
    location /api/ {
        resolver 127.0.0.11 8.8.8.8 valid=10s ipv6=off;
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_read_timeout 90s;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}